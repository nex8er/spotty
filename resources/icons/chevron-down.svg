<!-- Стрелка выпадающего списка и нижняя стрелка счётчика.
     Цвет один на обе темы и намеренно нейтрально-серый: он даёт 4.4:1 к тёмному фону поля
     и 4.0:1 к белому, то есть проходит по контрасту всюду, где встречается, — и не
     требует отдельного файла под каждую тему. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="10" height="10">
  <path d="M1.6 3.6 L5 7 L8.4 3.6"
        fill="none" stroke="#7a7f85" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
