<!-- Стрелка недоступной кнопки: тот же контур, приглушённый цвет. Отдельным файлом,
     потому что перекрасить SVG из таблицы стилей нельзя, а «упёрлось в предел диапазона»
     и «поле недоступно» должны быть видны — иначе счётчик выглядит сломанным.
     Требование по контрасту к недоступным элементам не предъявляется. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="10" height="10">
  <path d="M1.6 3.6 L5 7 L8.4 3.6"
        fill="none" stroke="#5c6066" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
